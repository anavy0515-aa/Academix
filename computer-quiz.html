<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#060b16;
    color:#fff;
    min-height:100vh;
}

header{
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(0,217,255,.15);
    background:rgba(5,10,22,.9);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    font-weight:bold;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#00d9ff,#8b5cf6);
    color:#fff;
    font-size:22px;
    box-shadow:0 0 20px rgba(0,217,255,.3);
}

.back{
    color:#00d9ff;
    text-decoration:none;
    border:1px solid rgba(0,217,255,.5);
    padding:9px 16px;
    border-radius:9px;
    transition:.25s;
}

.back:hover{
    background:#00d9ff;
    color:#06101b;
}

.container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

.hero{
    text-align:center;
    margin-bottom:30px;
}

.badge{
    display:inline-block;
    padding:7px 14px;
    border-radius:20px;
    background:rgba(139,92,246,.12);
    border:1px solid rgba(139,92,246,.4);

    font-size:13px;
    margin-bottom:15px;
}

h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    color:#9ca3af;
    font-size:16px;
}

.quiz-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.info-card{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    padding:16px;
    border-radius:14px;
    text-align:center;
}

.info-card span{
    display:block;
    color:#00d9ff;
    font-size:23px;
    font-weight:bold;
    margin-top:5px;
}

.progress-box{
    background:#111827;
    height:9px;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00d9ff,#8b5cf6);
    transition:.3s;
}

.quiz-card{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.question-number{
    color:#00d9ff;
    font-size:14px;
    margin-bottom:12px;
}

.question{
    font-size:24px;
    line-height:1.4;
    margin-bottom:25px;
}

.options{
    display:grid;
    gap:13px;
}

.option{
    padding:16px 18px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:rgba(255,255,255,.035);
    cursor:pointer;
    transition:.2s;
    font-size:16px;
}

.option:hover{
    border-color:#00d9ff;
    transform:translateY(-2px);
}

.option.correct{
    background:rgba(34,197,94,.15);
    border-color:#22c55e;
}

.option.wrong{
    background:rgba(239,68,68,.15);
    border-color:#ef4444;
}

.option.disabled{
    cursor:default;
}

.feedback{
    display:none;
    margin-top:20px;
    padding:14px;
    border-radius:10px;
    background:rgba(0,217,255,.07);
    border-left:3px solid #00d9ff;
    color:#d1d5db;
    line-height:1.5;
}

.controls{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
    gap:15px;
}

button{
    border:none;
    cursor:pointer;
    padding:12px 22px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
}

.next-btn{
    background:linear-gradient(135deg,#00d9ff,#8b5cf6);
    color:white;
}

.next-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.restart-btn{
    background:#111827;
    color:#00d9ff;
    border:1px solid rgba(0,217,255,.4);
}

.result{
    display:none;
    text-align:center;
    padding:40px 20px;
}

.result-icon{
    font-size:60px;
    margin-bottom:15px;
}

.result h2{
    font-size:35px;
    margin-bottom:10px;
}

.score{
    font-size:50px;
    font-weight:bold;
    color:#00d9ff;
    margin:20px;
}

.result p{
    color:#9ca3af;
    margin-bottom:25px;
}

.result-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.result-buttons a{
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    background:linear-gradient(135deg,#00d9ff,#8b5cf6);
}

.best-score{
    margin-top:18px;
    color:#a5b4fc;
}

@media(max-width:700px){
    h1{
        font-size:32px;
    }

    .quiz-info{
        grid-template-columns:1fr;
    }

    .quiz-card{
        padding:20px;
    }

    .question{
        font-size:20px;
    }

    header{
        padding:15px 5%;
    }

    .logo{
        font-size:17px;
    }
}
</style>
</head>

<div class="result-buttons">

🔄 Try Again

<a href="computer.html">

</div>

let quizQuestions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;
let timeLeft = 900;
let timerInterval;


function shuffle(array){

    return array.sort(() => Math.random() - 0.5);

}


function startQuiz(){

    quizQuestions = shuffle([...questions]);

    currentQuestion = 0;
    score = 0;
    answered = false;
    timeLeft = 900;

    document.getElementById("quizCard").style.display="block";
    document.getElementById("result").style.display="none";

    document.getElementById("score").textContent="0";

    clearInterval(timerInterval);

    timerInterval=setInterval(updateTimer,1000);

    loadQuestion();

}


function updateTimer(){

    let minutes=Math.floor(timeLeft/60);
    let seconds=timeLeft%60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2,"0") + ":" +
        String(seconds).padStart(2,"0");

    if(timeLeft<=0){

        clearInterval(timerInterval);
        finishQuiz();

    }

    timeLeft--;

}


function loadQuestion(){

    answered=false;

    const q=quizQuestions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion+1);

    document.getElementById("questionCount").textContent =
        (currentQuestion+1) + " / " + quizQuestions.length;

    document.getElementById("question").textContent=q.q;

    document.getElementById("feedback").style.display="none";

    document.getElementById("nextBtn").disabled=true;

    let progress=((currentQuestion)/quizQuestions.length)*100;

    document.getElementById("progress").style.width=progress+"%";

    const optionsBox=document.getElementById("options");

    optionsBox.innerHTML="";

    q.options.forEach((option,index)=>{

        const div=document.createElement("div");

        div.className="option";

        div.textContent=option;

        div.onclick=()=>selectAnswer(index,div);

        optionsBox.appendChild(div);

    });

}


function selectAnswer(index,element){

    if(answered) return;

    answered=true;

    const q=quizQuestions[currentQuestion];

    const options=document.querySelectorAll(".option");

    options.forEach(opt=>{
        opt.classList.add("disabled");
    });

    if(index===q.answer){

        element.classList.add("correct");

        score++;

        document.getElementById("score").textContent=score;

        document.getElementById("feedback").textContent=
            "✅ Correct! This is the right answer.";

    }else{

        element.classList.add("wrong");

        options[q.answer].classList.add("correct");

        document.getElementById("feedback").textContent=
            "❌ Not quite. The correct answer is: " +
            q.options[q.answer];

    }

    document.getElementById("feedback").style.display="block";

    document.getElementById("nextBtn").disabled=false;

}


function nextQuestion(){

    if(!answered) return;

    currentQuestion++;

    if(currentQuestion>=quizQuestions.length){

        finishQuiz();

    }else{

        loadQuestion();

    }

}


function finishQuiz(){

    clearInterval(timerInterval);

    document.getElementById("quizCard").style.display="none";

    document.getElementById("result").style.display="block";

    document.getElementById("progress").style.width="100%";

    const percentage=Math.round(
        (score/quizQuestions.length)*100
    );

    document.getElementById("finalScore").textContent=
        percentage+"%";

    let message="";

    if(percentage>=90){

        message="Outstanding! Your IT knowledge is excellent. 🚀";

    }else if(percentage>=75){

        message="Great work! You have a strong technology foundation. 💻";

    }else if(percentage>=50){

        message="Good attempt! Keep practicing and strengthen your concepts. 📚";

    }else{

        message="Keep learning! Review the IT Notes and try again. 🔥";

    }

    document.getElementById("resultMessage").textContent=message;

    let best=
        Number(localStorage.getItem("academixITQuizBest")) || 0;

    if(percentage>best){

        best=percentage;

        localStorage.setItem(
            "academixITQuizBest",
            best
        );

    }

    document.getElementById("bestScore").textContent=
        "🏆 Best Score: "+best+"%";

    localStorage.setItem(
        "academixITQuizLastScore",
        percentage
    );

}


function restartQuiz(){

    startQuiz();

}


startQuiz();
