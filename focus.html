<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Focus Timer | Academix</title>

<link rel="stylesheet" href="style.css">

<style>

.focus-page {
    min-height: 100vh;
    padding: 100px 20px 50px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.focus-card {
    width: 450px;
    max-width: 100%;
    padding: 35px;
    background: #111827;
    border: 1px solid #374151;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.focus-card h1 {
    color: #00d9ff;
    margin-bottom: 8px;
    font-size: 30px;
}

.focus-card .subtitle {
    color: #9ca3af;
    margin-bottom: 25px;
}

.timer-circle {
    width: 250px;
    height: 250px;
    margin: 20px auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;

    background:
        conic-gradient(#00d9ff 0deg, #1f2937 0deg);

    position: relative;
}

.timer-circle::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: #111827;
}

.timer {
    position: relative;
    z-index: 2;
    font-size: 52px;
    font-weight: bold;
    color: white;
}

.mode-title {
    color: #d1d5db;
    margin-top: 20px;
    margin-bottom: 10px;
}

.mode-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.mode-buttons button {
    padding: 10px 14px;
    border: 1px solid #374151;
    border-radius: 10px;
    cursor: pointer;
    background: #1f2937;
    color: white;
}

.mode-buttons button:hover {
    background: #374151;
}

.timer-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.timer-buttons button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.start-btn {
    background: #00d9ff;
    color: #071018;
}

.pause-btn {
    background: #f59e0b;
    color: #111827;
}

.reset-btn {
    background: #ef4444;
    color: white;
}

.timer-buttons button:hover {
    transform: translateY(-2px);
}

.stats {
    margin-top: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.stat-box {
    background: #1f2937;
    border-radius: 14px;
    padding: 15px;
}

.stat-box h3 {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 5px;
}

.stat-box span {
    color: white;
    font-size: 22px;
    font-weight: bold;
}

.status {
    margin-top: 20px;
    color: #9ca3af;
    font-size: 14px;
}

</style>

</head>

<body>

<div class="focus-page">

<div class="focus-card">

<h1>Focus Timer</h1>

<p class="subtitle">
Stay focused. Study smarter.
</p>

<div class="timer-circle" id="timerCircle">

<div class="timer" id="timer">
25:00
</div>

</div>

<div class="mode-title">
Choose Study Mode
</div>

<div class="mode-buttons">

<button onclick="setTimer(25)">
25 min
</button>

<button onclick="setTimer(50)">
50 min
</button>

<button onclick="setTimer(5)">
5 min Break
</button>

<button onclick="setTimer(10)">
10 min Break
</button>

</div>

<div class="timer-buttons">

<button class="start-btn" onclick="startTimer()">
▶ Start
</button>

<button class="pause-btn" onclick="pauseTimer()">
⏸ Pause
</button>

<button class="reset-btn" onclick="resetTimer()">
↻ Reset
</button>

</div>

<div class="status" id="status">
Ready to study 🚀
</div>

<div class="stats">

<div class="stat-box">

<h3>Sessions Completed</h3>

<span id="sessions">
0
</span>

</div>

<div class="stat-box">

<h3>Study Time</h3>

<span id="studyTime">
0 min
</span>

</div>

</div>

</div>

</div>

<script>

let selectedMinutes = 25;

let timeLeft = selectedMinutes * 60;

let totalTime = selectedMinutes * 60;

let timerInterval = null;

let sessions = 0;
let studyMinutes = Number(localStorage.getItem("academixStudyTime")) || 0;

let totalSessions = Number(localStorage.getItem("academixSessions")) || 0;

const timerDisplay =
document.getElementById("timer");

const timerCircle =
document.getElementById("timerCircle");

const statusText =
document.getElementById("status");

const sessionsDisplay =
document.getElementById("sessions");

const studyTimeDisplay =
document.getElementById("studyTime");


function updateDisplay() {

    let minutes =
        Math.floor(timeLeft / 60);

    let seconds =
        timeLeft % 60;


    minutes =
        String(minutes).padStart(2, "0");

    seconds =
        String(seconds).padStart(2, "0");


    timerDisplay.textContent =
        minutes + ":" + seconds;


    let progress =
        ((totalTime - timeLeft) / totalTime) * 360;


    timerCircle.style.background =
        "conic-gradient(#00d9ff " +
        progress +
        "deg, #1f2937 " +
        progress +
        "deg)";

}


function startTimer() {

    if (timerInterval !== null) {
        return;
    }


    statusText.textContent =
        "🔥 Focus mode ON";


    timerInterval =
        setInterval(function() {

            if (timeLeft > 0) {

                timeLeft--;

                updateDisplay();

            }

            else {

                clearInterval(timerInterval);

                timerInterval = null;


                sessions++;

                studyMinutes += selectedMinutes;
                totalSessions++;

localStorage.setItem("academixStudyTime", studyMinutes);

localStorage.setItem("academixSessions", totalSessions);


                sessionsDisplay.textContent =
                    sessions;


                studyTimeDisplay.textContent =
                    studyMinutes + " min";


                statusText.textContent =
                    "🎉 Session completed!";


                alert(
                    "Great job! Your focus session is complete."
                );

            }

        }, 1000);

}


function pauseTimer() {

    clearInterval(timerInterval);

    timerInterval = null;


    statusText.textContent =
        "⏸ Timer paused";


}


function resetTimer() {

    clearInterval(timerInterval);

    timerInterval = null;


    timeLeft =
        selectedMinutes * 60;


    totalTime =
        selectedMinutes * 60;


    statusText.textContent =
        "Ready to study 🚀";


    updateDisplay();

}


function setTimer(minutes) {

    clearInterval(timerInterval);

    timerInterval = null;


    selectedMinutes = minutes;


    timeLeft =
        minutes * 60;


    totalTime =
        minutes * 60;


    if (minutes <= 10) {

        statusText.textContent =
            "☕ Break time";

    }

    else {

        statusText.textContent =
            "Ready to study 🚀";

    }


    updateDisplay();

}


updateDisplay();

</script>

</body>

</html>
